<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cat, Night and Moon - Noticias de Gatos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0b1226;
            --card: #131c35;
            --card-hover: #1a2645;
            --accent: #c9a227;
            --accent-soft: #e8c66a;
            --secondary: #7d94c4;
            --text: #eef1f7;
            --muted: #94a0b8;
            --border: rgba(201, 162, 39, 0.18);
            --column-bg-es: rgba(201, 162, 39, 0.05);
            --column-bg-en: rgba(125, 148, 196, 0.05);
            --moon-pattern: none;
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Source Sans 3', sans-serif;
            background: var(--bg);
            background-image: var(--moon-pattern);
            color: var(--text);
            padding: 20px 10px;
            line-height: 1.6;
            min-height: 100vh;
        }
        header {
            max-width: 1400px;
            margin: 0 auto 40px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        header img {
            display: block;
            width: 100%;
            height: auto;
        }
        #lang-toggle {
            position: fixed;
            bottom: 20px; right: 20px;
            z-index: 999;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 50%;
            width: 60px; height: 60px;
            font-size: 1.4rem;
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.4);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #lang-toggle:hover { transform: scale(1.1); background: var(--secondary); color: #fff; }
        .columns-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            max-width: 1400px;
            margin: auto;
        }
        .column {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        .column-es { display: block; background: var(--column-bg-es); }
        .column-en { display: none;  background: var(--column-bg-en); }
        .column-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid;
        }
        .column-es .column-header { border-color: var(--accent);    }
        .column-en .column-header { border-color: var(--secondary);  }
        .column-header h2 { font-size: 1.5rem; font-family: 'Playfair Display', serif; font-weight: 600; letter-spacing: 0.01em; }
        .column-es h2 { color: var(--accent);   }
        .column-en h2 { color: var(--secondary); }
        .news-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        .card {
            background: #1a1a2e;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.2);
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            border: 1px solid #33334d;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.2);
            border-color: #ffd700;
        }
        .card img { width: 100%; height: 180px; object-fit: cover; }
        .card-content { padding: 16px; flex: 1; display: flex; flex-direction: column; }
        .card-content h3 { font-size: 1.25rem; margin-bottom: 10px; font-family: 'Playfair Display', serif; font-weight: 600; line-height: 1.3; color: #fff; }
        .source      { font-size: 0.85rem; color: var(--accent);    margin-bottom: 8px; font-weight: 500; }
        .date        { font-size: 0.8rem;  color: var(--secondary); margin-bottom: 8px; }
        .description { font-size: 0.9rem;  color: var(--muted);     margin-bottom: 12px; flex-grow: 1; }
        .card-footer { margin-top: auto; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .card-footer a { color: var(--accent); font-weight: 600; text-decoration: none; font-size: 0.9rem; }
        .translate-btn {
            background-color: transparent;
            border: 1px solid var(--secondary);
            color: var(--secondary);
            padding: 6px 10px;
            font-size: 0.8rem;
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.3s;
        }
        .translate-btn:hover    { background-color: var(--secondary); color: #fff; }
        .translate-btn:disabled { border-color: var(--muted); color: var(--muted); cursor: not-allowed; }
        .loading, .error-message, .no-more-news {
            text-align: center;
            padding: 40px 15px;
            color: var(--muted);
            font-size: 1rem;
        }
        #load-more {
            display: block;
            margin: 25px auto;
            padding: 12px 30px;
            border: 2px solid var(--accent);
            border-radius: 30px;
            background: var(--accent);
            color: #000;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        #load-more:hover    { background: var(--secondary); border-color: var(--secondary); color: #fff; }
        #load-more:disabled { background: var(--muted);     border-color: var(--muted);     cursor: not-allowed; }
        @media (min-width: 768px) {
            .columns-container { flex-direction: row; }
            .column { flex: 1; }
            .news-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (min-width: 1200px) {
            .news-grid { grid-template-columns: repeat(3, 1fr); }
            .news-grid .card:first-child { grid-column: span 2; }
            .news-grid .card:first-child img { height: 340px; }
            .news-grid .card:first-child h3 { font-size: 1.9rem; }
            .news-grid .card:first-child .card-content p { font-size: 1.05rem; }
        }
    </style>
</head>
<body>
    <header>
        <img src="img/cabecera.jpg" alt="cat, night and moon — las últimas noticias sobre gatos, razas, cuidados y curiosidades felinas">
    </header>

    <div class="columns-container">
        <div class="column column-es">
            <div class="column-header">
                <i class="fas fa-flag"></i><h2>Noticias en Español</h2>
            </div>
            <div id="news-es" class="news-grid">
                <div class="loading"><i class="fas fa-spinner fa-spin"></i> Buscando noticias...</div>
            </div>
        </div>
        <div class="column column-en">
            <div class="column-header">
                <i class="fas fa-flag-usa"></i><h2>English News</h2>
            </div>
            <div id="news-en" class="news-grid">
                <div class="loading"><i class="fas fa-spinner fa-spin"></i> Fetching news...</div>
            </div>
        </div>
    </div>

    <button id="load-more">Cargar más</button>
    <button id="lang-toggle" title="Cambiar idioma"><i class="fas fa-language"></i></button>

    <script>
        // ── Configuración ────────────────────────────────────────────────────────
        const PROXY = 'https://noticias-proxy.esperance.workers.dev';

        const RSS_FEEDS = {
            es: [
                'https://misanimales.com/feed/'
            ],
            en: [
                'https://iheartcats.com/feed/',
                'https://www.catster.com/feed/'
            ]
        };

        const catKeywords = [
            'gato', 'gatos', 'felino', 'felinos', 'gatito', 'gatitos', 'minino',
            'cat', 'cats', 'feline', 'felines', 'kitten', 'kittens', 'kitty',
            'persa', 'siamés', 'siamese', 'maine coon', 'bengal', 'ragdoll',
            'scottish fold', 'sphynx', 'abisinio', 'abyssinian', 'birman', 'angora',
            'pet cat', 'house cat', 'mascota felina', 'litter box', 'scratching post',
            'cat food', 'cat care', 'feline health', 'ronroneo', 'maullido', 'purr', 'meow'
        ];

        // ── Estado y DOM ─────────────────────────────────────────────────────────
        const DOM = {
            newsEs:       document.getElementById('news-es'),
            newsEn:       document.getElementById('news-en'),
            colEs:        document.querySelector('.column-es'),
            colEn:        document.querySelector('.column-en'),
            loadMoreBtn:  document.getElementById('load-more'),
            langToggleBtn:document.getElementById('lang-toggle')
        };

        const state = {
            page:          { es: 1, en: 1 },
            viewMode:      'es',
            isLoading:     false,
            seenIds:       new Set(),
            allNewsLoaded: { es: false, en: false },
            rssFallback:   { es: false, en: false }
        };

        // ── Helpers ──────────────────────────────────────────────────────────────
        function getArticleId(article) {
            return (article.title || '').substring(0, 50).toLowerCase();
        }

        function isCatRelated(article) {
            const text = (article.title + ' ' + (article.description || '')).toLowerCase();
            return catKeywords.some(kw => text.includes(kw));
        }

        const catImages = [
            'https://images.unsplash.com/photo-1533738363-b7f9aef128ce?w=400&h=250&fit=crop&auto=format&q=80',
            'https://images.unsplash.com/photo-1526336024174-e58f5cdd8e13?w=400&h=250&fit=crop&auto=format&q=80',
            'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=400&h=250&fit=crop&auto=format&q=80'
        ];
        const getCatImageUrl = () => catImages[Math.floor(Math.random() * catImages.length)];

        // ── Fuentes ──────────────────────────────────────────────────────────────
        async function fetchFromGNews(lang, page) {
            try {
                const query = lang === 'es' ? 'gato OR felino' : 'cat OR feline';
                const res = await fetch(`${PROXY}/gnews?q=${encodeURIComponent(query)}&lang=${lang}`);
                if (!res.ok) throw new Error(`GNews failed: ${res.status}`);
                const data = await res.json();
                return data.articles?.map(art => ({ ...art, urlToImage: art.image })) || [];
            } catch (e) {
                console.error('GNews error:', e);
                return [];
            }
        }

        async function fetchFromNewsAPI(lang, page) {
            try {
                const query = lang === 'es' ? 'gato OR gatito' : 'cat OR kitten';
                const res = await fetch(`${PROXY}/newsapi?q=${encodeURIComponent(query)}&lang=${lang}`);
                if (!res.ok) throw new Error(`NewsAPI failed: ${res.status}`);
                const data = await res.json();
                return data.articles || [];
            } catch (e) {
                console.error('NewsAPI error:', e);
                return [];
            }
        }

        async function fetchFromRSS(lang) {
            const feeds = RSS_FEEDS[lang] || [];
            const lotes = await Promise.allSettled(feeds.map(async (rssUrl) => {
                const res = await fetch(`${PROXY}/rss?url=${encodeURIComponent(rssUrl)}`);
                if (!res.ok) throw new Error(`RSS ${res.status}`);
                const xml = new DOMParser().parseFromString(await res.text(), "application/xml");
                if (xml.querySelector("parsererror")) throw new Error("XML no válido");
                const fuente = xml.querySelector("channel > title, feed > title")?.textContent || "RSS";
                return [...xml.querySelectorAll("item, entry")].map(it => {
                    const desc = it.querySelector("description, summary, content")?.textContent || "";
                    const link = it.querySelector("link")?.getAttribute("href")
                              || it.querySelector("link")?.textContent || "";
                    const medio = it.getElementsByTagName("media:content")[0]
                              || it.getElementsByTagName("media:thumbnail")[0]
                              || it.getElementsByTagName("enclosure")[0];
                    const img = medio?.getAttribute("url")
                              || (desc.match(/<img[^>]+src=["\']([^"\']+)/i) || [])[1] || null;
                    return {
                        title:       it.querySelector("title")?.textContent || "",
                        description: desc.replace(/<[^>]*>?/gm, "").trim().substring(0, 200) + "...",
                        url:         link,
                        urlToImage:  img,
                        publishedAt: it.querySelector("pubDate, updated, published")?.textContent || "",
                        source:      { name: fuente }
                    };
                });
            }));
            return lotes.filter(r => r.status === "fulfilled").flatMap(r => r.value);
        }

        // ── Orquestador ──────────────────────────────────────────────────────────
        async function fetchAllNews(lang, page) {
            if (state.rssFallback[lang]) return [];

            const apiResults = await Promise.allSettled([
                fetchFromGNews(lang, page),
                fetchFromNewsAPI(lang, page)
            ]);

            let combined = [];
            apiResults.forEach(result => {
                if (result.status === 'fulfilled' && Array.isArray(result.value)) {
                    combined.push(...result.value);
                }
            });

            let unique = combined.filter(art => {
                const id = getArticleId(art);
                if (!art.title || !art.url || !art.publishedAt || state.seenIds.has(id) || !isCatRelated(art)) {
                    return false;
                }
                state.seenIds.add(id);
                return true;
            });

            // Si las APIs no devuelven nada, activar RSS de respaldo
            if (unique.length === 0) {
                console.warn(`APIs sin resultados para '${lang}'. Intentando RSS...`);
                unique = await fetchFromRSS(lang);
                state.rssFallback[lang] = true;
            }

            return unique.sort((a, b) => new Date(b.publishedAt) - new Date(a.publishedAt));
        }

        // ── Renderizado ──────────────────────────────────────────────────────────
        const VACIAS = new Set(['de','del','la','el','los','las','un','una','unos','unas','y','o','en','a','que','se','su','sus','por','para','con','al','es','son','mas','the','of','in','on','to','for','and','a','an','is','was','it','its']);

        // Devuelve las palabras significativas de un titular, sin acentos ni signos.
        function clavesTitular(t) {
            return new Set((t || '')
                .toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9ñ ]/g, ' ')
                .split(/\s+/)
                .filter(w => w.length > 3 && !VACIAS.has(w)));
        }

        // Proporción de palabras compartidas respecto al titular más corto.
        function solape(a, b) {
            if (a.size === 0 || b.size === 0) return 0;
            let comunes = 0;
            for (const w of a) if (b.has(w)) comunes++;
            return comunes / Math.min(a.size, b.size);
        }

        const titularesVistos = [];
        const imagenesVistas = new Set();

        function renderArticles(articles, container, lang) {
            if (container.querySelector('.loading')) container.innerHTML = '';

            // Doce medios cuentan el mismo hallazgo: si el titular comparte más del
            // 60% de palabras con uno ya mostrado, se descarta como duplicado.
            articles = articles.filter(art => {
                const claves = clavesTitular(art.title);
                if (claves.size < 3) return true;
                if (titularesVistos.some(v => solape(claves, v) > 0.6)) return false;
                titularesVistos.push(claves);
                return true;
            });

            // Una misma foto de agencia ilustra la misma noticia en varios medios:
            // si la imagen ya salió, la tarjeta se queda sin foto en vez de repetirla.
            articles = articles.map(art => {
                if (!art.urlToImage) return art;
                const clave = art.urlToImage.split('?')[0];
                if (imagenesVistas.has(clave)) return { ...art, urlToImage: null };
                imagenesVistas.add(clave);
                return art;
            });

            if (articles.length === 0) {
                if (container.innerHTML !== '') {
                    if (!container.querySelector('.no-more-news')) {
                        const noMore = document.createElement('div');
                        noMore.className = 'no-more-news';
                        noMore.textContent = 'No se encontraron más noticias.';
                        container.appendChild(noMore);
                    }
                } else {
                    container.innerHTML = '<div class="error-message">No se pudieron cargar noticias. Inténtalo más tarde.</div>';
                }
                state.allNewsLoaded[lang] = true;
                updateLoadMoreButton();
                return;
            }

            const fragment = document.createDocumentFragment();
            articles.forEach(art => {
                const card = document.createElement('div');
                card.className = 'card';
                const date = new Date(art.publishedAt).toLocaleDateString(
                    lang === 'es' ? 'es-ES' : 'en-US', { dateStyle: 'long' }
                );
                const fallback = getCatImageUrl();
                const translateBtnHtml = lang === 'en' ? `
                    <button class="translate-btn"
                            data-title="${(art.title || '').replace(/"/g, '&quot;')}"
                            data-desc="${(art.description || '').replace(/"/g, '&quot;')}">
                        <i class="fas fa-language"></i> Traducir
                    </button>` : '';

                card.innerHTML = `
                    <img src="${art.urlToImage || fallback}" alt="${art.title}" loading="lazy" onerror="this.src='${fallback}'">
                    <div class="card-content">
                        <span class="date"><i class="fas fa-calendar-alt"></i> ${date}</span>
                        <h3>${art.title}</h3>
                        <div class="source"><i class="fas fa-paw"></i> ${art.source?.name || 'Fuente desconocida'}</div>
                        ${art.description ? `<div class="description">${art.description}</div>` : ''}
                        <div class="card-footer">
                            ${translateBtnHtml}
                            <a href="${art.url}" target="_blank" rel="noopener noreferrer">
                                <i class="fas fa-external-link-alt"></i> Leer más
                            </a>
                        </div>
                    </div>`;
                fragment.appendChild(card);
            });
            container.appendChild(fragment);
        }

        // ── Traducción ───────────────────────────────────────────────────────────
        async function handleTranslation(event) {
            const btn = event.target.closest('.translate-btn');
            if (!btn) return;
            const card    = btn.closest('.card');
            const titleEl = card.querySelector('h3');
            const descEl  = card.querySelector('.description');
            btn.disabled  = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i>`;
            try {
                const text = `${btn.dataset.title} ||| ${btn.dataset.desc}`;
                const res  = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|es`);
                const data = await res.json();
                const [translatedTitle, translatedDesc] = data.responseData.translatedText.split(' ||| ');
                if (titleEl && translatedTitle) titleEl.textContent = translatedTitle.trim();
                if (descEl  && translatedDesc)  descEl.textContent  = translatedDesc.trim();
                btn.innerHTML = `<i class="fas fa-check"></i> Traducido`;
            } catch (e) {
                btn.innerHTML = `<i class="fas fa-times"></i> Error`;
                setTimeout(() => { btn.disabled = false; btn.innerHTML = `<i class="fas fa-language"></i> Traducir`; }, 2000);
            }
        }

        // ── Carga ────────────────────────────────────────────────────────────────
        async function loadNews(isInitial = false) {
            if (state.isLoading) return;
            state.isLoading = true;
            DOM.loadMoreBtn.disabled = true;
            DOM.loadMoreBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Cargando...';

            const loadForLang = async (lang) => {
                if (state.allNewsLoaded[lang]) return;
                const news = await fetchAllNews(lang, state.page[lang]);
                renderArticles(news, lang === 'es' ? DOM.newsEs : DOM.newsEn, lang);
                if (news.length > 0 && !state.rssFallback[lang]) {
                    state.page[lang]++;
                } else {
                    state.allNewsLoaded[lang] = true;
                }
            };

            if (isInitial) {
                await Promise.all([loadForLang('es'), loadForLang('en')]);
            } else {
                if      (state.viewMode === 'es')   await loadForLang('es');
                else if (state.viewMode === 'en')   await loadForLang('en');
                else if (state.viewMode === 'both') {
                    await Promise.all([
                        DOM.colEs.style.display !== 'none' && loadForLang('es'),
                        DOM.colEn.style.display !== 'none' && loadForLang('en')
                    ].filter(Boolean));
                }
            }

            state.isLoading = false;
            DOM.loadMoreBtn.disabled = false;
            DOM.loadMoreBtn.innerHTML = 'Cargar más';
            updateLoadMoreButton();
        }

        function updateLoadMoreButton() {
            let canLoadMore = false;
            if      (state.viewMode === 'es')   canLoadMore = !state.allNewsLoaded.es;
            else if (state.viewMode === 'en')   canLoadMore = !state.allNewsLoaded.en;
            else if (state.viewMode === 'both') canLoadMore = !state.allNewsLoaded.es || !state.allNewsLoaded.en;
            DOM.loadMoreBtn.style.display = canLoadMore ? 'block' : 'none';
        }

        function updateView() {
            DOM.colEs.style.display = (state.viewMode === 'es' || state.viewMode === 'both') ? 'block' : 'none';
            DOM.colEn.style.display = (state.viewMode === 'en' || state.viewMode === 'both') ? 'block' : 'none';
            updateLoadMoreButton();
        }

        // ── Eventos ──────────────────────────────────────────────────────────────
        DOM.loadMoreBtn.addEventListener('click', () => loadNews(false));
        DOM.newsEn.addEventListener('click', handleTranslation);
        DOM.langToggleBtn.addEventListener('click', () => {
            const modes = ['es', 'en', 'both'];
            state.viewMode = modes[(modes.indexOf(state.viewMode) + 1) % modes.length];
            updateView();
        });

        document.addEventListener('DOMContentLoaded', () => loadNews(true));
    </script>
</body>
</html>
